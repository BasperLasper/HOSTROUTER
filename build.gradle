plugins { id 'java' }
group = 'com.peakmc'
version = '1.0.4'
repositories { mavenLocal(); mavenCentral(); maven { url = uri('https://repo.papermc.io/repository/maven-public/') } }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
dependencies {
    compileOnly 'com.velocitypowered:velocity-api:4.2.0'
    annotationProcessor 'com.velocitypowered:velocity-api:4.2.0'
    implementation 'org.yaml:snakeyaml:2.7'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation 'com.velocitypowered:velocity-api:4.2.0'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
jar {
    archiveFileName = "HostRouter-${version}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
}
